<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ActToKnowQARevealCover — カバーをずらして答えて置く</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef2f0;
      --ink: #1b1f1c;
      --muted: #5c6560;
      --line: #c9d2cc;
      --card: #fbfcfb;
      --ok: #0b6b45;
      --accent: #1f4d3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Noto Sans JP", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 380px at 0% -10%, #d5e6dc 0%, transparent 55%),
        var(--bg);
      line-height: 1.5;
    }
    main { max-width: 960px; margin: 0 auto; padding: 2rem 1.25rem 3.5rem; }
    h1 { font-size: 1.45rem; margin: 0 0 0.4rem; }
    h2 { font-size: 1.08rem; margin: 1.8rem 0 0.6rem; }
    p.lead { color: var(--muted); margin: 0 0 1.1rem; max-width: 42rem; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border: 1px solid var(--line);
      font-size: 0.88rem;
      margin-bottom: 0.85rem;
    }
    th, td { padding: 0.45rem 0.55rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { background: #e5ebe7; font-weight: 600; }
    table.kv th { width: 8.5rem; }
    .ok { color: var(--ok); font-weight: 700; }
    .muted { color: var(--muted); }
    a { color: var(--accent); }
    figure {
      margin: 0 0 0.85rem;
      background: var(--card);
      border: 1px solid var(--line);
    }
    video { width: 100%; display: block; background: #111; }
    figcaption { padding: 0.4rem 0.55rem; font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>カバーをずらして答えて置く</h1>
  <p class="lead">
    レモンとライムが箱の下に隠れている。上から見ても分からないので箱をずらし、
    「どちらがレモンか」に答えてからボウルへ置く。
    Active Perception → Interactive Perception → QA → Active Manipulation。
  </p>
  <p class="muted">
    <a href="index.html">開けた棚の中を探す</a>
    ·
    <a href="occluded.html">箱の裏を探してボウルに置く</a>
  </p>

  <h2>結果（seed 5）</h2>
  <table>
    <thead>
      <tr><th>#</th><th>内容</th><th>結果</th></tr>
    </thead>
    <tbody>
      <tr><td>AP</td><td>両カバーを上から見る</td><td class="ok">まだ分からない</td></tr>
      <tr><td>IP</td><td>左のカバーをずらす</td><td class="ok">ライム</td></tr>
      <tr><td>QA</td><td>レモンはどちらか</td><td class="ok">右</td></tr>
      <tr><td>AM</td><td>レモンをボウルへ置く</td><td class="ok">できた</td></tr>
    </tbody>
  </table>

  <h2>動画</h2>
  <figure>
    <video controls playsinline autoplay muted>
      <source src="videos/qa/qa_side_by_side_2x.mp4" type="video/mp4" />
    </video>
    <figcaption>2倍速 · 左: 三人称 · 右: 一人称</figcaption>
  </figure>
  <figure>
    <video controls playsinline>
      <source src="videos/qa/qa_side_by_side.mp4" type="video/mp4" />
    </video>
    <figcaption>原速</figcaption>
  </figure>
</main>
</body>
</html>
